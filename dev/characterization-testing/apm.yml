name: characterization-testing
description: 'Safety-net-first workflow for changing existing code that has no or
  untrusted tests: scope the observable behaviour that must survive the change, find
  the least invasive seam to get the code under test, write characterization tests
  that pin down what the code actually does today — capturing surprising or buggy
  behaviour as-is and reporting it instead of silently fixing it — then make the intended
  change with the net in place, so the failing tests are exactly the intentionally
  changed behaviours. Use before modifying, refactoring, or extracting legacy code
  that lacks tests, or when changes to an area keep breaking behaviour nobody predicted.
  Not for greenfield code, not for code already covered by trusted tests, and not
  for deciding whether current behaviour is correct — that decision belongs to the
  user.'
