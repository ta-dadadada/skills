name: implementation-loop
description: 'Convergence loop for implementing an already agreed change one acceptance
  criterion at a time: re-observe the repository, use deterministic evidence, reopen
  criteria only for material findings tied to agreed scope, escalate new project constraints
  instead of silently adopting them, and use targeted re-review after an initial independent
  fresh-context full-diff review. Use after issue-kickoff or equivalent intake when
  settled criteria, dependencies, blockers, or review feedback require coordination
  across implementation cycles. Not for deriving scope or criteria, supplying domain-specific
  implementation methods, PR/commit planning, or a small direct change whose normal
  workflow already provides a sufficient convergence path.'
