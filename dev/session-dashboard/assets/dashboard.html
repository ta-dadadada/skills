<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>セッションの作業記録</title>
<style>
:root { color-scheme: light; --ink:#17312e; --muted:#51635f; --line:#cedbd6; --paper:#fff; --accent:#135c50; }
* { box-sizing:border-box; }
body { margin:0; background:#f1f5f2; color:var(--ink); font:14px/1.45 system-ui,sans-serif; overflow-wrap:anywhere; }
main, body > aside { max-width:1440px; margin:auto; padding:12px 20px; }
.copy-tools { max-width:1440px; margin:auto; padding:8px 20px 0; }
.copy-tools button { font:inherit; color:var(--ink); background:white; border:1px solid var(--line); border-radius:4px; padding:5px 10px; cursor:pointer; }
.copy-tools button:focus-visible,.copy-tools textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.copy-tools textarea { display:block; width:100%; min-height:180px; margin:6px 0; font:12px/1.5 monospace; }
#copy-status { margin-left:8px; font-size:.8rem; }
header { border-top:3px solid var(--accent); padding-top:10px; }
h1 { font-size:clamp(1.2rem,2vw,1.6rem); line-height:1.3; margin:8px 0; }
h2 { font-size:1rem; margin:6px 0 8px; }
h3 { font-size:.9rem; margin:4px 0; }
p { white-space:pre-wrap; margin:4px 0; }
p:empty { display:none; }
.eyebrow,.meta { color:var(--muted); font-size:.75rem; }
.eyebrow { letter-spacing:.06em; }
header h2 { margin:8px 0 2px; font-size:.8rem; }
header ul { display:flex; flex-wrap:wrap; column-gap:28px; row-gap:2px; margin:4px 0; }
section { padding:8px 12px; background:var(--paper); border:1px solid var(--line); margin:10px 0; border-radius:4px; min-width:0; }
article + article { border-top:1px solid var(--line); margin-top:8px; padding-top:6px; }
.requests { border-left:3px solid #987029; }
.badge { display:inline-block; font-size:.72rem; font-weight:650; border:1px solid #a8c6bd; background:#e9f4ee; border-radius:3px; padding:1px 5px; }
.columns { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:12px; }
.columns > section { margin-top:0; }
.session-info { margin:8px 0; font-size:.75rem; }
.session-info > div { display:flex; gap:8px; margin:2px 0; }
.session-info dt { flex:0 0 9em; color:var(--muted); }
.session-info dd { margin:0; min-width:0; }
.session-info code { font-size:inherit; overflow-wrap:anywhere; }
.widgets { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:4px 0; }
.widgets > div + div { border-left:1px solid var(--line); padding-left:12px; }
.widgets dd { margin:3px 0; font-size:1.15rem; font-weight:650; font-variant-numeric:tabular-nums; }
.widgets dt { color:var(--muted); font-size:.75rem; }
.todos { padding:0; list-style:none; margin:4px 0; }
.todos li { padding:6px 0; border-top:1px solid var(--line); }
ol,ul { padding-left:20px; margin:6px 0; }
.notice { padding:6px 10px; background:#fff0d0; }
body > aside { padding-top:8px; padding-bottom:0; font-size:.75rem; color:var(--muted); }
@media(max-width:600px) { .columns { display:block; } .widgets { gap:8px; } .widgets > div + div { padding-left:8px; } .widgets dd { font-size:1rem; } main,body > aside { padding:10px; } section { padding:8px; } }
@media(max-width:320px) { .widgets { display:block; } .widgets > div + div { border-left:0; border-top:1px solid var(--line); padding:6px 0 0; margin-top:6px; } }
@media print { body { background:white; } body > aside,.copy-tools { display:none; } .columns { display:block; } }
</style>
</head>
<body>
<aside id="connection" role="status">保存された作業記録です。内容は最終保存時点のものです。</aside>
<div class="copy-tools">
<button type="button" id="copy-markdown">Markdownをコピー</button>
<span id="copy-status" role="status"></span>
<div id="copy-fallback" hidden>
<label for="markdown-text">手動コピー用Markdown（ボタンを押した時点の内容）</label>
<textarea id="markdown-text" readonly spellcheck="false"></textarea>
<button type="button" id="close-copy">閉じる</button>
</div>
</div>
<main><!--CONTENT--></main>
<script>
function dashboardMarkdown(root) {
  const escape = text => text.replace(/([!"#$%&'()*+,\-./:;<=>?@[\\\]^_`{|}~])/g, '\\$1');
  function render(node) {
    if (node.nodeType === Node.TEXT_NODE) return escape(node.textContent);
    if (node.nodeType !== Node.ELEMENT_NODE) return '';
    const tag = node.tagName;
    const content = () => Array.from(node.childNodes, render).join('');
    if (/^H[1-6]$/.test(tag)) return '\n\n' + '#'.repeat(Number(tag[1])) + ' ' + content().trim() + '\n\n';
    if (tag === 'BR') return '\n';
    if (tag === 'DL') {
      return '\n\n' + Array.from(node.children, row => {
        const term = row.querySelector('dt');
        const value = row.querySelector('dd');
        if (!term || !value) return render(row);
        const notes = Array.from(row.querySelectorAll('p'), p => escape(p.textContent)).join(' / ');
        return '- **' + escape(term.textContent) + '**: ' + escape(value.textContent)
          + (notes ? ' (' + notes + ')' : '');
      }).join('\n') + '\n\n';
    }
    if (tag === 'UL' || tag === 'OL') {
      return '\n\n' + Array.from(node.children, (item, index) => {
        const text = Array.from(item.childNodes, render).join('').trim();
        const state = item.dataset.todoStatus;
        const prefix = state ? (state === 'done' ? '- [x] ' : '- [ ] ') : (tag === 'OL' ? (index + 1) + '. ' : '- ');
        return prefix + text.replace(/\n/g, '\n' + ' '.repeat(prefix.startsWith('-') ? 2 : prefix.length));
      }).join('\n') + '\n\n';
    }
    if (tag === 'P') return '\n\n' + content().trim() + '\n\n';
    if (['SECTION','ARTICLE','HEADER','MAIN'].includes(tag)) return '\n\n' + content() + '\n\n';
    return content();
  }
  return render(root).trim().replace(/\n{3,}/g, '\n\n') + '\n';
}
const copyButton = document.getElementById('copy-markdown');
const copyStatus = document.getElementById('copy-status');
const fallback = document.getElementById('copy-fallback');
const markdownText = document.getElementById('markdown-text');
copyButton.addEventListener('click', async () => {
  const markdown = dashboardMarkdown(document.querySelector('main').cloneNode(true));
  copyButton.disabled = true;
  copyStatus.textContent = 'コピー中…';
  fallback.hidden = true;
  try {
    await navigator.clipboard.writeText(markdown);
    copyStatus.textContent = 'Markdownをコピーしました。';
  } catch (_) {
    markdownText.value = markdown;
    fallback.hidden = false;
    copyStatus.textContent = '自動コピーできませんでした。下の欄を選択してコピーしてください。';
    markdownText.focus();
    markdownText.select();
  } finally { copyButton.disabled = false; }
});
document.getElementById('close-copy').addEventListener('click', () => {
  fallback.hidden = true;
  copyButton.focus();
});

if (location.protocol === 'http:' || location.protocol === 'https:') {
  const status = document.getElementById('connection');
  let version = '';
  async function refresh() {
    try {
      const response = await fetch('/view.json', {cache:'no-store', signal:AbortSignal.timeout(5000)});
      if (!response.ok) throw new Error('refresh failed');
      const next = await response.json();
      if (next.version !== version) {
        document.querySelector('main').innerHTML = next.html;
        version = next.version;
      }
      document.getElementById('elapsed-time').textContent = next.elapsed;
      status.textContent = '自動更新中 · 表示は最後に報告された状態です。更新がないことは稼働の保証ではありません。';
    } catch (_) {
      status.textContent = '接続できません。最後の表示を保持しています。自動で再接続します。';
    } finally { setTimeout(refresh, 3000); }
  }
  refresh();
}
</script>
</body>
</html>
