name: hypothesis-driven-debugging
description: 'Hypothesis-first debugging workflow for defects whose cause is unknown:
  reproduce and capture the failure, localize it to a candidate region, form falsifiable
  hypotheses ranked by evidence, confirm or refute each by observation (instrumentation,
  debugger, bisect) — one variable at a time, with refuted hypotheses recorded so
  they are not retried — fix the confirmed root cause minimally, then verify by re-running
  the original reproduction and lock it in with a regression test. Use when investigating
  a failing test, wrong output, crash, or regression whose cause is not yet established,
  or when a supposed fix did not hold and the defect has resurfaced. Not for changes
  whose cause is already demonstrated, not for performance tuning, and not for live-incident
  mitigation where restoring service precedes diagnosis.'
