<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ</title>
<style>
:root {
  color-scheme: light dark;
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1d2127; --muted:#69717c; --faint:#9aa1aa; --line:#dde1e6; --soft:#eef0f3;
  --lane-a:#f8f9fb; --lane-b:#f1f3f6; --shadow:0 6px 24px rgba(15,23,42,.16);
  --queued:#8a929c; --active:#2563c9; --waiting:#b7791f; --blocked:#c53030; --done:#2f855a; --dropped:#a0a7b0;
  --waiting-bg:#fdf3e1; --blocked-bg:#fdeaea;
  --k-approval:#b7791f; --k-decision:#7c4dbb; --k-review:#2563c9; --k-launch:#2f855a; --k-criteria:#c05621;
  --e-dep:#2563c9; --e-spawn:#7c4dbb; --e-rel:#8a929c; --slide:.16s;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#121519; --panel:#1b1f25; --ink:#e3e6ea; --muted:#9aa3ad; --faint:#6b737d; --line:#2d333b; --soft:#242a31;
    --lane-a:#171b20; --lane-b:#1d2228; --shadow:0 6px 24px rgba(0,0,0,.5);
    --queued:#8b939d; --active:#6aa2ff; --waiting:#e5b250; --blocked:#ff7b7b; --done:#5fcf95; --dropped:#6b737d;
    --waiting-bg:#2c2416; --blocked-bg:#311c1c;
    --k-approval:#e5b250; --k-decision:#b791f0; --k-review:#6aa2ff; --k-launch:#5fcf95; --k-criteria:#f0965a;
    --e-dep:#6aa2ff; --e-spawn:#b791f0; --e-rel:#8b939d;
  }
}
@media (prefers-reduced-motion: reduce) { :root { --slide:0s; } }
* { box-sizing:border-box; }
html,body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif; }
button { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--active); outline-offset:2px; }
.ic { fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.app { display:grid; grid-template-rows:auto minmax(0,1fr); height:100dvh; }
.masthead { background:var(--panel); border-bottom:1px solid var(--line); padding:14px 24px; display:grid; gap:12px; }
.bar { display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px; min-width:0; }
.bar h1 { font-size:22px; letter-spacing:-.045em; margin:0; line-height:1; }
.sync { margin-inline-start:auto; display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:5px; background:var(--soft); font-size:12px; }
.chip strong { font-size:14px; font-variant-numeric:tabular-nums; }
.chip.warn { background:var(--waiting-bg); }
.chip.bad { background:var(--blocked-bg); }
#wait-link { color:var(--ink); text-decoration:none; }
#wait-link:hover { text-decoration:underline; }
.summary { display:grid; gap:6px; }
.progress { height:7px; display:flex; border-radius:4px; overflow:hidden; background:var(--soft); }
.progress span { display:block; min-width:2px; }
.progress span + span { border-inline-start:2px solid var(--panel); }
.status-counts { display:flex; flex-wrap:wrap; gap:3px 16px; color:var(--muted); font-size:12px; }
.status-count { display:inline-flex; align-items:center; gap:5px; }
.status-count b { color:var(--ink); font-variant-numeric:tabular-nums; }
.meta { color:var(--muted); font-size:12px; }
#updated.old { color:var(--blocked); }
.dot { display:inline-block; flex:none; width:8px; height:8px; border-radius:50%; background:var(--tone,var(--faint)); }
.dot.live { background:var(--done); } .dot.down { background:var(--blocked); }
#conn { display:inline-flex; align-items:center; gap:5px; }
.iconbtn { display:inline-flex; align-items:center; gap:4px; border:0; background:transparent; border-radius:4px; padding:4px 6px; cursor:pointer; color:var(--muted); font-size:12px; }
.iconbtn:hover,.iconbtn[aria-expanded="true"] { background:var(--soft); color:var(--ink); }
.ticker { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ticker:empty { display:none; }
/* main area */
.main { display:grid; grid-template-columns:minmax(0,1fr) 380px; min-height:0; transition:grid-template-columns var(--slide) ease; }
.main.side-collapsed { grid-template-columns:minmax(0,1fr) 32px; }
.workspace { min-width:0; min-height:0; display:flex; flex-direction:column; }
.view-bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; padding:14px 20px 8px; }
.view-bar h2 { font-size:18px; margin:0; }
.view-switch { display:flex; gap:2px; padding:3px; border-radius:7px; background:var(--soft); }
.view-switch button { border:1px solid transparent; border-radius:5px; background:transparent; color:var(--muted); padding:5px 10px; cursor:pointer; font-size:12px; font-weight:650; }
.view-switch button:hover { color:var(--ink); }
.view-switch button[aria-pressed="true"] { background:var(--panel); color:var(--ink); border-color:var(--line); }
.overview { overflow:auto; min-width:0; flex:1; padding:4px 20px 24px; }
.stats { overflow:auto; min-width:0; flex:1; padding:4px 20px 24px; }
.stats:focus-visible { outline-offset:-2px; }
.stats h3 { font-size:15px; margin:0 0 4px; }
.stats-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%, 155px),1fr)); gap:8px; margin:0 0 18px; }
.stats-summary > div,.stats-target { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:10px 12px; }
.stats-summary dt { color:var(--muted); font-weight:650; }
.stats-summary dd { margin:2px 0 0; }
.stats-value { display:block; font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; }
.stats-targets { display:grid; gap:8px; list-style:none; padding:0; margin:8px 0 0; }
.stats-target { display:grid; gap:6px; }
.stats-target h4 { margin:0; font-size:14px; overflow-wrap:anywhere; }
.stats-target header { display:flex; align-items:baseline; flex-wrap:wrap; justify-content:space-between; gap:4px 9px; }
.stats-target .progress { height:12px; }
.timing-section { margin:0 0 18px; }
.timing-card { display:grid; gap:6px; padding:10px 12px; margin:8px 0; border:1px solid var(--line); border-radius:7px; background:var(--panel); }
.timing-card h4 { margin:0; font-size:14px; }
.timing-card .progress { height:12px; }
.timing-wait { --tone:var(--waiting); }
.timing-agent { --tone:var(--active); }
.timing-other { --tone:var(--queued); }
.wait-stats { width:100%; border-collapse:collapse; margin-top:6px; font-size:12px; }
.wait-stats th,.wait-stats td { padding:5px 7px; border-bottom:1px solid var(--line); text-align:start; vertical-align:top; }
.wait-stats thead th { color:var(--muted); }
.wait-stats td { font-variant-numeric:tabular-nums; }
.group { margin-bottom:20px; }
.group-head { display:flex; gap:8px; align-items:center; padding:8px 0; margin-bottom:8px; border-bottom:1px solid var(--line); }
.group-head h3 { font-size:14px; margin:0; }
.group-head .count { padding:0 7px; border-radius:5px; background:var(--soft); color:var(--muted); font-size:12px; font-weight:650; }
.task-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%, 295px),1fr)); gap:10px; list-style:none; padding:0; margin:0; }
.task-grid li { min-width:0; }
.task-card { display:flex; flex-direction:column; align-items:stretch; gap:7px; width:100%; height:100%; min-width:0; text-align:start; padding:11px 13px 12px; border:1px solid var(--line); border-inline-start:3px solid var(--tone); border-radius:8px; background:var(--panel); cursor:pointer; }
.task-card:hover { border-color:var(--tone); }
.task-card.sel { border-color:var(--active); box-shadow:inset 0 0 0 1px var(--active); }
.task-top,.task-meta { display:flex; align-items:baseline; flex-wrap:wrap; gap:3px 9px; min-width:0; }
.task-top { justify-content:space-between; align-items:center; }
.task-code { color:var(--muted); font:600 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; }
.task-state { display:inline-flex; gap:5px; align-items:center; font-size:11px; font-weight:700; background:var(--soft); border-radius:4px; padding:2px 6px; }
.st-waiting-user .task-state { background:var(--waiting-bg); }
.st-blocked .task-state { background:var(--blocked-bg); }
.task-title { font-size:15px; font-weight:650; line-height:1.5; overflow-wrap:anywhere; white-space:pre-line; }
.task-meta { margin-top:auto; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
.task-meta .alert { color:var(--ink); font-weight:650; }
.task-bottom { flex-basis:100%; }
.map { display:flex; flex:1; flex-direction:column; min-height:0; min-width:0; padding:4px 20px 16px; }
.map[hidden] { display:none; }
.map-controls { display:flex; align-items:center; flex-wrap:wrap; gap:6px 12px; }
.map-control-group { display:flex; align-items:center; flex-wrap:wrap; gap:3px; }
.map-controls button { min-width:32px; min-height:32px; padding:2px 7px; border:1px solid var(--line); border-radius:5px; background:var(--panel); cursor:pointer; }
.map-controls button:hover:not([aria-disabled="true"]) { border-color:var(--active); }
.map-controls button[aria-disabled="true"] { color:var(--muted); background:var(--soft); cursor:default; }
#map-scale { min-width:4em; text-align:center; font-variant-numeric:tabular-nums; }
.map-help { flex-basis:100%; margin:0; }
.map-viewport { flex:1; min-height:0; overflow:auto; overflow-anchor:none; border:1px solid var(--line); border-radius:7px; background:var(--panel); }
.map-viewport:focus-visible { outline-offset:1px; }
.map-viewport.can-pan { cursor:grab; }
.map-viewport.dragging,.map-viewport.dragging .node { cursor:grabbing; }
#graph svg { display:block; }
.legend { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:11px; color:var(--muted); padding:6px 2px; align-items:center; }
.legend svg { vertical-align:middle; margin-right:3px; }
.st-queued { --tone:var(--queued); }
.st-active { --tone:var(--active); }
.st-waiting-user { --tone:var(--waiting); }
.st-blocked { --tone:var(--blocked); }
.st-done { --tone:var(--done); }
.st-dropped { --tone:var(--dropped); }
.side { border-left:1px solid var(--line); background:var(--panel); overflow:auto; min-height:0; min-width:0; display:flex; flex-direction:column; }
.side-head { display:flex; align-items:center; gap:7px; padding:14px 12px 10px; }
.side h2 { font-size:14px; margin:0; display:flex; gap:7px; align-items:center; font-variant-numeric:tabular-nums; }
.side-count { display:inline-flex; align-items:center; gap:4px; padding:2px 6px; border-radius:5px; background:var(--waiting-bg); }
.side h2.zero .side-count { background:var(--soft); }
.side-body { flex:none; display:grid; grid-template-rows:1fr; transition:grid-template-rows var(--slide) ease; }
.side-body > .inner { overflow:hidden; min-height:0; }
.side-collapsed .side { overflow:hidden; cursor:pointer; }
.side-collapsed .side-head { flex-direction:column; padding:14px 2px; }
.side-collapsed .side-label { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
.side-collapsed .side-count { flex-direction:column; padding:3px; }
.side-collapsed .side-body { grid-template-rows:0fr; visibility:hidden; transition:grid-template-rows var(--slide) ease, visibility 0s var(--slide); }
.side-collapsed #side-btn .chev { transform:rotate(180deg); }
ul.waits { list-style:none; margin:0 12px 8px; padding:0; display:grid; gap:6px; }
.wrow { border:1px solid var(--line); border-radius:7px; }
.wrow.open,.wrow:has(.wait.sel) { border-color:var(--active); }
.wait { display:flex; align-items:flex-start; gap:3px; padding:3px; }
.wait-toggle { display:grid; grid-template-columns:auto minmax(0,1fr); width:100%; gap:0 5px; padding:4px; border:0; border-radius:4px; text-align:start; background:transparent; cursor:pointer; }
.wait-toggle:hover { background:var(--soft); }
.wait .cp { margin-top:4px; }
.chev { flex:none; color:var(--muted); transition:transform var(--slide); display:inline-flex; }
.wait-toggle > .chev { margin-top:2px; }
.wrow.open .chev { transform:rotate(90deg); }
.wait-label { display:flex; flex-wrap:wrap; gap:3px 6px; align-items:center; }
.kind { flex:none; font-size:11px; font-weight:600; padding:0 5px; border-radius:3px; color:#fff; line-height:16px; }
.k-approval { background:var(--k-approval); } .k-decision { background:var(--k-decision); } .k-review { background:var(--k-review); }
.k-launch { background:var(--k-launch); } .k-criteria { background:var(--k-criteria); }
@media (prefers-color-scheme: dark) { .kind,.pill { color:#121519; } }
.wid { font-weight:700; font-variant-numeric:tabular-nums; }
.tid { color:var(--muted); font-variant-numeric:tabular-nums; }
.wsum { grid-column:2; margin-top:3px; overflow-wrap:anywhere; white-space:pre-line; }
/* slide-open drawers: grid rows animate between 0fr and 1fr */
.slide { display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--slide) ease; }
.slide.open { grid-template-rows:1fr; }
#detail-wrap { transition:none; }
.slide > .inner { overflow:hidden; min-height:0; }
.wait-more { position:relative; padding:4px 28px 7px 27px; background:var(--soft); font-size:12px; border-left:3px solid var(--active); }
.wait-more .line { display:flex; flex-wrap:wrap; align-items:center; gap:2px 8px; color:var(--muted); overflow-wrap:anywhere; }
.x { position:absolute; top:3px; right:4px; }
.empty { color:var(--muted); font-size:12px; padding:2px 12px; }
.tasks-empty { padding:32px 4px; color:var(--muted); }
/* graph */
.lane-bg-0 { fill:var(--lane-a); } .lane-bg-1 { fill:var(--lane-b); }
.lane-label { fill:var(--muted); font-size:12px; font-weight:600; }
.node { cursor:pointer; outline:none; }
.node .card { fill:var(--panel); stroke:var(--line); stroke-width:1; }
.node .rail { fill:var(--queued); }
.node:hover .card { stroke:var(--muted); }
.node:focus-visible .card,.node.sel .card { stroke:var(--active); stroke-width:2.5; }
.node:focus-visible .card { stroke-dasharray:5 2; }
.node .map-title { color:var(--ink); font-size:14px; font-weight:650; line-height:18px; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.node .t3 { fill:var(--muted); font-size:11px; }
.node .stale { fill:var(--waiting); font-weight:600; }
.node .steplbl { fill:var(--ink); font-size:11px; font-weight:650; }
.node .rail,.node .cur { fill:var(--tone); }
.st-waiting-user .card { fill:var(--waiting-bg); }
.st-blocked .card { fill:var(--blocked-bg); }
.step { fill:var(--panel); stroke:var(--faint); stroke-width:1; }
.step.past { fill:var(--faint); stroke:none; }
.stepline { stroke:var(--line); stroke-width:1.5; }
.pr { fill:var(--active); font-size:10px; font-weight:600; }
.edge { fill:none; stroke-width:1.6; }
.edge.depends_on { stroke:var(--e-dep); }
.edge.spawned_from { stroke:var(--e-spawn); stroke-dasharray:6 4; }
.edge.related { stroke:var(--e-rel); stroke-dasharray:2 4; }
.mk-depends_on { fill:var(--e-dep); } .mk-spawned_from { fill:var(--e-spawn); }
.edge.dim { opacity:.25; } .edge.hot { stroke-width:2.6; opacity:1; }
/* tooltip (preview only), detail drawer, history */
#tip { position:fixed; z-index:20; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow); padding:7px 9px; font-size:12px; pointer-events:none; }
#tip { overflow-wrap:anywhere; }
#tip .h { font-weight:700; margin-bottom:2px; }
#tip .r { color:var(--muted); }
#tip .s { margin-top:3px; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.detail { position:relative; margin:8px 8px; padding:8px 10px 10px; border:1px solid var(--active); border-radius:6px; background:var(--bg); font-size:12px; }
.detail header { display:grid; justify-items:start; gap:6px; }
.detail .detail-meta { display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding-right:22px; }
.detail header h2 { display:block; font-size:16px; margin:0; min-width:0; max-width:100%; overflow-wrap:anywhere; white-space:pre-line; }
.detail .sub { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; margin:4px 0 2px; }
.detail hr { border:0; border-top:1px solid var(--line); margin:6px 0; }
.detail ul { list-style:none; padding:0; margin:0; }
.detail li { padding:2px 0; overflow-wrap:anywhere; }
.sess + .sess { border-top:1px dashed var(--line); margin-top:4px; padding-top:4px; }
.sess .sum { white-space:pre-wrap; overflow-wrap:anywhere; margin-top:2px; }
dl.f { display:grid; grid-template-columns:max-content 1fr; gap:2px 10px; margin:4px 0; }
dl.f dt { color:var(--faint); } dl.f dd { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
.pill { display:inline-block; font-size:11px; font-weight:600; padding:0 6px; border-radius:8px; color:#fff; line-height:17px; white-space:nowrap; }
.p-queued { background:var(--queued); } .p-active { background:var(--active); } .p-waiting-user { background:var(--waiting); }
.p-blocked { background:var(--blocked); } .p-done { background:var(--done); } .p-dropped { background:var(--dropped); }
.stepper { display:flex; gap:3px; flex-wrap:wrap; }
.stepper span { font-size:11px; padding:0 6px; border-radius:8px; border:1px solid var(--line); color:var(--faint); }
.stepper span.past { color:var(--muted); background:var(--soft); }
.stepper span.cur { color:#fff; border-color:transparent; }
.mono { font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--soft); padding:0 4px; border-radius:3px; overflow-wrap:anywhere; }
.copyable { display:inline-flex; align-items:center; gap:1px; max-width:100%; }
.cp { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; padding:0; border:0; border-radius:3px; background:transparent; color:var(--faint); cursor:pointer; flex:none; }
.cp:hover,.cp:focus-visible { color:var(--ink); background:var(--soft); }
.cp.ok { color:var(--done); } .cp.fail { color:var(--blocked); }
.art { color:var(--muted); margin-right:4px; }
a { color:var(--active); }
.drawer { position:fixed; z-index:15; top:64px; right:12px; width:440px; max-height:calc(100vh - 76px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); padding:10px 12px 12px; }
.drawer ol { list-style:none; padding:0; margin:0; font-size:12px; }
.drawer li { padding:3px 0; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
.drawer .ty { font-weight:600; margin:0 4px; }
@media (max-width:850px) {
  .app { height:auto; }
  .main,.main.side-collapsed { grid-template-columns:minmax(0,1fr); }
  .side { border-left:0; border-top:1px solid var(--line); }
  .side-collapsed .side-head { flex-direction:row; padding:8px 12px; }
  .side-collapsed .side-label { position:static; width:auto; height:auto; clip-path:none; }
  .side-collapsed .side-count { flex-direction:row; padding:2px 6px; }
  #side-btn .chev { transform:rotate(90deg); }
  .side-collapsed #side-btn .chev { transform:rotate(-90deg); }
  .masthead { padding:12px 14px; }
  .view-bar { padding-inline:14px; }
  .overview,.map,.stats { padding-inline:14px; }
  .map-viewport { flex:auto; max-height:62dvh; }
  .map-controls button { min-height:40px; min-width:40px; }
  .drawer { left:8px; right:8px; width:auto; top:auto; bottom:8px; max-height:70vh; }
}
@media (max-width:440px) {
  .sync { margin-inline-start:0; }
  .status-counts { gap:3px 10px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="bar">
      <h1 id="title">HQ</h1>
      <div class="chips">
        <span class="chip" id="sessions-count"></span>
        <a class="chip" id="wait-link" href="#side"></a>
      </div>
      <div class="sync">
        <span id="conn" role="status" class="meta"><span class="dot" id="conn-dot"></span><span id="conn-text"></span></span>
        <span class="meta" id="updated"></span>
        <button type="button" class="iconbtn" id="history-btn" aria-expanded="false" aria-controls="history"></button>
      </div>
    </div>
    <div class="summary">
      <div class="progress" id="progress" aria-hidden="true"></div>
      <div class="status-counts" id="status-counts"></div>
    </div>
    <div class="ticker" id="ticker"></div>
  </header>
  <main class="main">
    <section class="workspace" aria-labelledby="tasks-h">
      <div class="view-bar">
        <h2 id="tasks-h"></h2>
        <div class="view-switch" role="group" id="view-switch">
          <button type="button" id="overview-btn" aria-pressed="true" aria-controls="overview"></button>
          <button type="button" id="map-btn" aria-pressed="false" aria-controls="map"></button>
          <button type="button" id="stats-btn" aria-pressed="false" aria-controls="stats"></button>
        </div>
      </div>
      <div class="overview" id="overview"></div>
      <section class="map" id="map" hidden>
        <div id="map-tools" hidden>
          <div class="map-controls">
            <div class="map-control-group" id="map-zoom-controls" role="group">
              <button type="button" id="map-smaller" aria-controls="map-viewport">−</button>
              <output id="map-scale"></output>

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v; else node.setAttribute(k, v);
  }
  for (const kid of kids.flat(4)) if (kid !== null && kid !== undefined && kid !== '' && kid !== false) node.append(typeof kid === 'object' ? kid : document.createTextNode(String(kid)));
  return node;
}
function sv(tag, attrs, ...kids) {
  const node = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) node.setAttribute(k, v);
  for (const kid of kids.flat(4)) if (kid !== null && kid !== undefined && kid !== '' && kid !== false) node.append(typeof kid === 'object' ? kid : document.createTextNode(String(kid)));
  return node;
}
function icon(name, size) {

}
function setText(id, text) { $(id).textContent = text; }
function units(ch) { return /[ᄀ-￿]/.test(ch) ? 2 : 1; }
function clip(text, max) {

  for (const ch of String(text || '')) { n += units(ch); if (n > max) return out + '…'; out += ch; }
  return out;
}
function oneLine(text) { return String(text || '').replace(/\s+/g, ' ').trim(); }
function fmtTime(iso) {

}
function ago(iso) {

  if (m < 1) return L.ago.now;
  if (m < 60) return m + L.ago.m;
  if (m < 48 * 60) return Math.floor(m / 60) + L.ago.h;

}

function isUrl(ref) { return /^https?:\/\//i.test(ref || ''); }
function chipText(a) {

  if (a.kind === 'branch') return '⎇';

  return '•';
}

// ---------- copy: compact icon buttons; the value itself stays selectable text
async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (_) {
    const ta = el('textarea', {readonly:'', style:'position:fixed;left:-9999px;top:0'});
    ta.value = text; document.body.append(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    ta.remove();
  }
  const label = ok ? L.copied : L.copyFail;
  btn.replaceChildren(icon(ok ? 'ok' : 'fail'));
  btn.classList.add(ok ? 'ok' : 'fail');
  btn.setAttribute('aria-label', label); btn.title = label;
  setTimeout(() => {
    btn.replaceChildren(icon('copy')); btn.classList.remove('ok', 'fail');
    btn.setAttribute('aria-label', btn.dataset.label); btn.title = btn.dataset.label;
  }, 1500);
}
function copyBtn(text) {
  const label = `${L.copy}: ${clip(oneLine(text), 60)}`;
  const btn = el('button', {type:'button', class:'cp', title:label, 'aria-label':label, 'data-label':label}, icon('copy'));
  btn.addEventListener('click', e => { e.stopPropagation(); copyText(text, btn); });
  return btn;
}
function copyable(text, mono) {
  if (!text) return null;
  return el('span', {class:'copyable'}, el('span', {class:mono === false ? '' : 'mono'}, text), copyBtn(text));
}

    s.host_id ? el('div', {}, el('span', {class:'meta'}, L.host + ': '), copyable(s.host_id)) : null,
    s.thread_id ? el('div', {}, el('span', {class:'meta'}, L.chatId + ': '), copyable(s.thread_id)) :
      s.client_thread_id ? el('div', {}, el('span', {class:'meta'}, L.pendingChat + ': '), copyable(s.client_thread_id)) : null);
}
function closeBtn(onClose) {

// ---------- derived model
function build(s) {
  const tasks = new Map(s.tasks.map(t => [t.id, t]));
  const sessionsBy = new Map(), artsBy = new Map(), waitsBy = new Map();
  const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
  for (const x of s.sessions) push(sessionsBy, x.task_id, x);
  for (const x of s.artifacts) push(artsBy, x.task_id, x);
  const open = s.waits.filter(w => w.status === 'open');
  for (const w of open) push(waitsBy, w.task_id, w);
  for (const list of sessionsBy.values()) list.sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at)));
  return {tasks, sessionsBy, artsBy, waitsBy, open, sessions:new Map(s.sessions.map(x => [x.id, x]))};
}
function latestSession(id) {
  const list = model.sessionsBy.get(id) || [];
  return list.find(x => x.state !== 'archived') || list[0] || null;
}
function step(t) {
  // 0 queued · 1 launched · 2 working · 3 waiting (or to verify) · 4 done
  if (t.status === 'done') return [4, L.steps[4]];
  if (t.status === 'dropped') return [-1, L.status.dropped];
  if (t.status === 'waiting-user') return [3, L.steps[3]];
  if (t.status === 'blocked') return [3, L.status.blocked];
  const s = latestSession(t.id);
  if (!s) return t.status === 'queued' ? [0, L.steps[0]] : [2, L.steps[2]];
  if (s.state === 'starting') return [1, L.steps[1]];
  if (s.state === 'done') return [3, L.verify];
  if (s.state === 'waiting-user') return [3, L.steps[3]];
  return t.status === 'queued' ? [0, L.steps[0]] : [2, L.steps[2]];
}
function reportTime(s) { return s ? (s.reported_at || s.created_at) : null; }
function isStale(t) {
  const s = latestSession(t.id);
  if (!s || !['starting','working'].includes(s.state) || ['done','dropped'].includes(t.status)) return false;
  const ts = Date.parse(reportTime(s));
  return !isNaN(ts) && Date.now() - ts > STALE_MS;
}

function taskStatusCounts(tasks) {
  const counts = Object.fromEntries(BAR_ORDER.map(k => [k, 0]));
  for (const task of tasks) counts[task.status]++;

}
function statusSegments(counts) {

}

}

// ---------- waiting column: wrapped summaries with expandable context
function setWaitOpen(id, open) {
  const li = document.querySelector(`#waits .wrow[data-wait="${CSS.escape(id)}"]`);
  if (open) {
    expanded.delete(id); expanded.add(id);

  } else expanded.delete(id);

  for (const id of [...expanded]) if (!open.some(w => w.id === id)) expanded.delete(id);

    open.map(w => model.sessions.get(w.session_id)?.name || '')]);

    const button = el('button', {type:'button', class:'wait-toggle', 'aria-controls':'wait-' + w.id, 'aria-expanded':'false'},
      el('span', {class:'chev'}, icon('chev', 12)),
      el('span', {class:'wait-label'}, el('span', {class:'kind k-' + w.kind}, L.kinds[w.kind] || w.kind),
        el('span', {class:'wid'}, w.id), t ? el('span', {class:'tid'}, t.id) : null),
      el('span', {class:'wsum'}, w.summary));

// ---------- task overview
function taskCard(t) {

function formatDuration(seconds) {
  if (seconds == null) return '—';
  let remaining = Math.round(seconds);
  const parts = [];
  for (const [unit, size] of [['day',86400],['hour',3600],['minute',60],['second',1]]) {
    const quantity = Math.floor(remaining / size);
    if (quantity || (unit === 'second' && !parts.length)) {
      parts.push(new Intl.NumberFormat(lang, {style:'unit', unit, unitDisplay:'short'}).format(quantity));
      remaining %= size;
      if (parts.length === 2) break;
    }
  }
  return parts.join(lang === 'ja' ? '' : ' ');
}

function completionTimes(completion) {

  if (!count) return el('p', {class:'meta'}, T.emptyLead);
  const parts = [['timing-agent', T.agent, agent], ['timing-wait', T.wait, wait], ['timing-other', T.other, total - wait - agent]];
  return el('div', {class:'timing-card'},
    el('h4', {}, T.lead),
    el('strong', {class:'stats-value'}, formatDuration(total / count)),
    el('div', {class:'progress', 'aria-hidden':'true'}, parts.filter(([, , seconds]) => seconds > 0).map(([cls, , seconds]) =>
      el('span', {class:cls, style:`flex:${seconds};background:var(--tone)`}))),
    el('div', {class:'status-counts'}, parts.map(([cls, label, seconds]) =>
      el('span', {class:'status-count ' + cls}, el('span', {class:'dot', 'aria-hidden':'true'}), label,
        el('b', {}, formatDuration(cls === 'timing-agent' && !observed ? null : seconds / count))))),
    el('div', {class:'meta'}, `${T.sample} · ${count}`),

}

function waitTimes(resolved) {

  const open = Object.fromEntries(WAIT_ORDER.map(kind => [kind, {count:0, oldest:null}]));
  const now = Date.now();
  for (const wait of model.open) {
    const item = open[wait.kind];

    item.count++;
    if (Number.isFinite(seconds)) item.oldest = Math.max(item.oldest ?? 0, seconds);

    el('div', {class:'meta'}, T.requests(count)));

    el('h4', {id:'wait-stats-heading'}, T.waitHeading),
    el('div', {class:'meta'}, T.waitHelp),

const PAN_DISTANCE = 120;

  ArrowDown:[0, PAN_DISTANCE], ArrowRight:[PAN_DISTANCE, 0]

  const ratio = MAP_SCALES[next] / MAP_SCALES[mapScale];

// ---------- progress map: swimlane per target, column per dependency depth
const NW = 272, NH = 128, DH = 104, GX = 44, GY = 10, LW = 136, LP = 10;
function layout() {
  const tasks = state.tasks;
  const preds = new Map(tasks.map(t => [t.id, []]));
  for (const e of state.edges) if (e.kind !== 'related' && preds.has(e.from) && preds.has(e.to)) preds.get(e.from).push(e.to);
  const depth = new Map();
  const visit = (id, seen) => {
    if (depth.has(id)) return depth.get(id);
    if (seen.has(id)) return 0;
    seen.add(id);
    let d = 0;
    for (const p of preds.get(id)) d = Math.max(d, visit(p, seen) + 1);
    seen.delete(id); depth.set(id, d); return d;
  };
  for (const t of tasks) visit(t.id, new Set());
  const lanes = [];
  for (const t of tasks.slice().sort((a, b) => a.num - b.num)) if (!lanes.includes(t.target)) lanes.push(t.target);
  const maxDepth = Math.max(0, ...depth.values());
  const pos = new Map(), laneBoxes = [];
  let y = 0;
  lanes.forEach((target, li) => {
    const cells = new Map();
    for (const t of tasks.filter(x => x.target === target)) {
      const d = depth.get(t.id);
      if (!cells.has(d)) cells.set(d, []);
      cells.get(d).push(t);
    }
    let laneH = 0;
    for (const [d, list] of cells) {
      list.sort((a, b) => (['done','dropped'].includes(a.status) - ['done','dropped'].includes(b.status)) || a.num - b.num);
      let cy = y + LP;
      for (const t of list) {
        const h = ['done','dropped'].includes(t.status) ? DH : NH;
        pos.set(t.id, {x: LW + d * (NW + GX), y: cy, h, task: t});
        cy += h + GY;
      }
      laneH = Math.max(laneH, cy - y - GY + LP);
    }
    laneBoxes.push({target, y, h: laneH, i: li});
    y += laneH;
  });
  return {pos, laneBoxes, width: LW + (maxDepth + 1) * (NW + GX) - GX + 54, height: y};
}
function renderGraph() {
  const host = $('graph');

  const focused = host.contains(document.activeElement) ? document.activeElement.dataset.task : null;
  const hasTasks = Boolean(state?.tasks.length);
  $('map-tools').hidden = !hasTasks;
  $('legend').hidden = !hasTasks;
  mapViewport.tabIndex = hasTasks ? 0 : -1;
  if (!hasTasks) {
    host.replaceChildren(el('p', {class:'tasks-empty'}, L.noTasks));
    updateMapCursor();
    return;
  }
  const scroll = [mapViewport.scrollLeft, mapViewport.scrollTop];
  const {pos, laneBoxes, width, height} = layout();
  const root = sv('svg', {viewBox:`0 0 ${width} ${height}`, role:'group', 'aria-label':L.map});
  sizeMap(root);
  const defs = sv('defs');
  for (const kind of ['depends_on','spawned_from']) defs.append(sv('marker', {id:'ar-' + kind, viewBox:'0 0 10 10', refX:'9', refY:'5', markerWidth:'7', markerHeight:'7', orient:'auto'}, sv('path', {d:'M0,0 L10,5 L0,10 z', class:'mk-' + kind})));

function setSideCollapsed(collapsed, persist) {
  sideCollapsed = collapsed;
  document.querySelector('.main').classList.toggle('side-collapsed', collapsed);
  $('side-body').inert = collapsed;
  const btn = $('side-btn'), label = collapsed ? L.sideOpen : L.sideClose;
  btn.setAttribute('aria-expanded', String(!collapsed));
  btn.title = label; btn.setAttribute('aria-label', label);
  if (!btn.firstChild) btn.append(el('span', {class:'chev'}, icon('chev', 13)));
  updateSelection();
  if (persist) saveSidePref(collapsed);
}
$('side-btn').addEventListener('click', e => { e.stopPropagation(); setSideCollapsed(!sideCollapsed, true); });
$('side').addEventListener('click', e => { if (sideCollapsed && !e.target.closest('#side-btn')) setSideCollapsed(false, true); });

$('wait-link').addEventListener('click', e => {
  e.preventDefault();
  setSideCollapsed(false, true);
  $('side-btn').focus();
});

function taskControl(id) {
  if (view === 'stats') return null;
  const host = view === 'map' ? $('graph') : $('overview');
  return host.querySelector(`[data-task="${CSS.escape(id)}"]`);
}
function updateSelection() {
  for (const n of document.querySelectorAll('.task-card, #graph .node')) {
    const current = n.dataset.task === selected;
    n.classList.toggle('sel', current);
    n.setAttribute('aria-expanded', String(current && !sideCollapsed));
  }
  for (const w of document.querySelectorAll('#waits .wait')) w.classList.toggle('sel', w.dataset.task === selected);
  highlight();
}
function select(id, fromWait = null) {
  if (sideCollapsed) setSideCollapsed(false, false);
  const changed = selected !== id || !detailOpen();
  selected = id;
  waitOrigin = fromWait;
  hideTip();
  updateSelection();
  renderDetail(changed);
  if (!fromWait) $('detail-title')?.focus();
}
function detailOpen() { return $('detail-wrap').classList.contains('open'); }
function setDetailOpen(open) {
  const wrap = $('detail-wrap');
  wrap.classList.toggle('open', open);
  wrap.inert = !open;
}
function closeDetail() {
  const id = selected;
  selected = null;
  setDetailOpen(false);
  detailSig = null;
  updateSelection();
  const origin = waitOrigin && document.querySelector(`#waits .wrow[data-wait="${CSS.escape(waitOrigin)}"] .wait-toggle`);
  waitOrigin = null;
  if (id) (origin || taskControl(id) || $(view + '-btn')).focus();
}
function renderDetail(force) {
  const box = $('detail');
  const t = selected && model && model.tasks.get(selected);
  if (!t) { setDetailOpen(false); detailSig = null; delete box.dataset.task; return; }
  const sessions = model.sessionsBy.get(t.id) || [];
  const arts = model.artsBy.get(t.id) || [];
  const waits = model.waitsBy.get(t.id) || [];
  const edges = state.edges.filter(e => e.from === t.id || e.to === t.id);
  const sig = JSON.stringify([lang, t, sessions, arts, waits, edges, edges.map(e => model.tasks.get(e.from === t.id ? e.to : e.from)?.title)]);
  // Polling must not disturb a pinned panel: skip when its data is unchanged, defer while text is selected in it.
  if (!force && sig === detailSig && detailOpen()) return;
  if (!force && selectionInside(box)) { detailPending = true; return; }
  const keepScroll = box.dataset.task === t.id ? $('side').scrollTop : null;
  const focusedTitle = document.activeElement === $('detail-title');
  const [cur, label] = step(t);
  const field = (name, value) => value ? [el('dt', {}, name), el('dd', {}, value)] : null;
  const rel = edges.map(e => {
    const out = e.from === t.id, other = out ? e.to : e.from, o = model.tasks.get(other);
    const sample = sv('svg', {width:'26', height:'10', 'aria-hidden':'true'}, sv('path', {d:'M2,5 L24,5', class:'edge ' + e.kind}));
    return el('li', {title:`${e.from} ${L.edges[e.kind]} ${e.to}`}, sample, ` ${out ? '→' : '←'} `, copyable(other), o ? ` ${o.title}` : '');
  });
  box.replaceChildren(...[
    el('header', {}, el('div', {class:'detail-meta'}, copyable(t.id),
      el('span', {class:'pill p-' + t.status}, L.status[t.status] || t.status)),
      el('h2', {id:'detail-title', tabindex:'-1'}, t.title)),
    closeBtn(closeDetail),
    el('div', {class:'sub'}, el('span', {class:'meta', title:L.target}, t.target),
      cur >= 0 ? el('div', {class:'stepper'}, L.steps.map((name, i) => el('span',
        {class: i === cur ? 'cur p-' + t.status : (i < cur ? 'past' : '')}, i === cur ? label : name))) : null),
    el('dl', {class:'f'}, field(L.goal, t.goal), field(L.deliverable, t.deliverable), field(L.doneWhen, t.done_criteria), field(L.authority, t.authority)),
    waits.length ? [el('hr'), el('ul', {}, waits.map(w => el('li', {},
      el('span', {class:'kind k-' + w.kind}, L.kinds[w.kind] || w.kind), ' ', copyable(w.id), ' ', el('span', {}, w.summary), copyBtn(w.summary))))] : null,
    sessions.length ? [el('hr'), sessions.map(s => el('div', {class:'sess'},
      el('div', {}, s.name ? el('b', {}, s.name + ' ') : null, copyable(s.id), ' ', el('span', {class:'meta'}, L.status[s.state] || s.state), ' ',
        s.reported_at ? when(s.reported_at) : el('span', {class:'meta'}, L.noReport)),
      nativeSessionDetails(s),
      s.branch || s.cwd ? el('div', {}, s.branch ? [el('span', {class:'art', title:L.branch}, '⎇'), copyable(s.branch), ' '] : null, s.cwd ? copyable(s.cwd) : null) : null,
      s.summary ? el('div', {class:'sum'}, el('span', {}, s.summary), copyBtn(s.summary)) : null))] : null,
    arts.length ? [el('hr'), el('ul', {}, arts.map(a => el('li', {title:a.label},
      el('span', {class:'art'}, chipText(a)),
      isUrl(a.ref) ? el('span', {class:'copyable'}, el('a', {href:a.ref, target:'_blank', rel:'noopener noreferrer'}, a.ref), copyBtn(a.ref)) : copyable(a.ref))))] : null,
    rel.length ? [el('hr'), el('ul', {}, rel)] : null].flat(4).filter(Boolean));
  box.setAttribute('aria-label', `${t.id} ${t.title}`);
  box.dataset.task = t.id;
  box.dataset.builds = String(Number(box.dataset.builds || 0) + 1);
  setDetailOpen(true);
  if (keepScroll !== null) $('side').scrollTop = keepScroll;
  if (focusedTitle) $('detail-title').focus({preventScroll:true});
  detailSig = sig; detailPending = false;
}

// ---------- history drawer
function renderHistory() {
  const box = $('history');
  $('history-btn').setAttribute('aria-expanded', String(historyOpen));
  if (!historyOpen) { box.hidden = true; return; }
  const events = state ? state.events : [];
  box.setAttribute('aria-label', L.history);
  box.replaceChildren(closeBtn(() => { historyOpen = false; renderHistory(); $('history-btn').focus(); }),
    events.length ? el('ol', {}, events.map(e => el('li', {}, el('span', {class:'meta'}, fmtTime(e.ts)), el('span', {class:'ty'}, e.type),
      [e.task_id, e.session_id].filter(Boolean).length ? el('span', {class:'meta'}, [e.task_id, e.session_id].filter(Boolean).join(' ') + ' ') : null, e.text)))
      : el('p', {class:'empty'}, L.noEvents));
  box.hidden = false;
}

// ---------- render and poll
function applyLang(code) {
  const base = String(code || 'en').split('-')[0];
  lang = LABELS[code] ? code : (LABELS[base] ? base : 'en');
  L = LABELS[lang];
  document.documentElement.lang = code || 'en';
  document.title = 'HQ';
  $('title').title = L.readonly;
  $('title').setAttribute('aria-label', L.readonly);
  setText('tasks-h', L.tasks);
  setText('overview-btn', L.overview);
  setText('map-btn', L.mapView);
  setText('stats-btn', L.statsView);
  $('view-switch').setAttribute('aria-label', L.views);
  $('map').setAttribute('aria-label', L.mapView);
  mapViewport.setAttribute('aria-label', L.mapNav.canvas);
  mapViewport.setAttribute('aria-describedby', 'map-help');
  $('map-zoom-controls').setAttribute('aria-label', L.mapNav.zoom);
  $('map-scale').setAttribute('aria-label', L.mapNav.zoom);
  $('map-pan-controls').setAttribute('aria-label', L.mapNav.pan);
  for (const key of ['smaller', 'larger', 'reset']) $('map-' + key).setAttribute('aria-label', L.mapNav[key]);
  for (const button of $('map-pan-controls').querySelectorAll('button')) button.setAttribute('aria-label', L.mapNav[button.dataset.pan]);
  setText('map-reset', L.mapNav.reset);
  setText('map-help', L.mapNav.help);
  setSideCollapsed(sideCollapsed, false);
}
function render() {
  applyLang(state ? state.lang : document.documentElement.lang);
  model = state ? build(state) : null;
  if (selected && model && !model.tasks.has(selected)) closeDetail();
  renderHeader();
  renderWaits();
  renderTaskView();
  renderDetail();
  if (historyOpen) renderHistory();
}
function setConn(kind) {
  const text = kind === 'live' ? L.live : kind === 'down'
    ? (state ? `${L.offlineData} ${fmtTime(state.generated_at)}` : L.offlineNone) : L.connecting;
  $('conn-dot').className = 'dot ' + (kind === 'live' ? 'live' : kind === 'down' ? 'down' : '');
  $('conn').title = text;
  if ($('conn-text').textContent !== text) setText('conn-text', text);
  $('updated').classList.toggle('old', kind === 'down');
}
async function refresh() {
  try {
    const response = await fetch('/api/state' + (revision === null ? '' : '?since=' + encodeURIComponent(revision)), {cache:'no-store'});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if (!data.unchanged) { state = data; render(); }
    revision = data.revision;
    setConn('live');
  } catch (_) {
    setConn('down');
  } finally {
    setTimeout(refresh, 3000);
  }
}
document.addEventListener('selectionchange', () => {
  if (detailPending && !selectionInside($('detail'))) renderDetail();
  if (waitsPending && !selectionInside($('waits'))) renderWaits();
});
$('history-btn').addEventListener('click', () => { historyOpen = !historyOpen; renderHistory(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (sideCollapsed) { if (historyOpen) { historyOpen = false; renderHistory(); $('history-btn').focus(); } return; }
  const row = document.activeElement?.closest?.('#waits .wrow');
  if (historyOpen) { historyOpen = false; renderHistory(); $('history-btn').focus(); }
  else if (row && expanded.has(row.dataset.wait)) { setWaitOpen(row.dataset.wait, false); row.querySelector('.wait-toggle').focus(); }
  else if (detailOpen()) closeDetail();
  else if (expanded.size) setWaitOpen([...expanded].pop(), false);
});
sideCollapsed = loadSidePref();
try { state = JSON.parse($('hq-initial').textContent); } catch (_) { state = null; }
if (state && state.revision !== undefined) revision = state.revision; else state = null;
render();
setConn(state ? 'live' : 'connecting');
setInterval(() => { if (state && (view !== 'stats' || !selectionInside($('stats')))) renderTaskView(); }, 30000);
if (location.protocol === 'http:' || location.protocol === 'https:') refresh(); else setConn('down');
</script>
