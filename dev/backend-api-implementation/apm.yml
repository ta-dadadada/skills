name: backend-api-implementation
description: 'Contract-first workflow for implementing a backend API endpoint in an
  existing project: discover the project''s conventions, fix the input/output contract
  (schemas, error shapes, status/error codes), write tests against the contract, implement,
  verify with a real request. Tech-agnostic — REST, GraphQL, and gRPC alike. Use when
  adding a new endpoint or operation to an existing backend, or when changing an existing
  endpoint''s request/response shape, error handling, or behaviour. Not for designing
  a new API or service from scratch.'
license: MIT
type: skill
version: '0.1.0'
