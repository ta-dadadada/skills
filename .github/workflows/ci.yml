name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Python changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      python: ${{ steps.diff.outputs.python }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Python-related changes
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          fi

          git diff --name-only -z --no-renames "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          python_changed=false
          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              *.py|*.pyi|.github/workflows/ci.yml)
                python_changed=true
                ;;
            esac
            case "${changed_path##*/}" in
              pyproject.toml|setup.cfg|tox.ini|pytest.ini|.python-version|requirements*.txt|requirements*.in|Pipfile|Pipfile.lock|poetry.lock|uv.lock|pdm.lock)
                python_changed=true
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo "python=$python_changed" >> "$GITHUB_OUTPUT"

  checks:
    name: Validate and test (Python ${{ matrix.python-version }})
    needs: changes
    runs-on: ubuntu-slim
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false

      - name: Validate skill packages
        run: python3 meta/shiranui-hanten/scripts/validate_skill.py dev/* meta/*

      - name: Test local-intake
        if: needs.changes.outputs.python == 'true'
        run: |
          python3 -m unittest discover -s dev/local-intake/tests -v
          python3 dev/local-intake/scripts/serve_form.py --help
