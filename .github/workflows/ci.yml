name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Validate and test
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          check-latest: false

      - name: Validate skill packages
        run: python3 meta/shiranui-hanten/scripts/validate_skill.py dev/* meta/*

      - name: Test local-intake
        run: |
          python3 -m unittest discover -s dev/local-intake/tests -v
          python3 dev/local-intake/scripts/serve_form.py --help
